name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest test_core.py test_pro.py test_interactions.py test_callbacks.py test_backup.py test_security.py test_calendar.py test_workflows.py test_flow_ui.py test_miniapp.py test_miniapp_hardening.py -v
      - name: Browser syntax check
        run: node --check miniapp/app.js
      - name: Release check
        run: python scripts/check_public.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Fictional-data browser checks
        run: npm run test:browser
        env:
          BROWSER_OUTPUT: ${{ runner.temp }}/workshift-browser
      - name: Save fictional screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fictional-browser-checks
          path: ${{ runner.temp }}/workshift-browser
          retention-days: 7
