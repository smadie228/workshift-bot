name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Full isolated server regression
        run: python scripts/run_server_checks.py
      - name: Browser syntax check
        run: node --check miniapp/app.js
      - name: Release check
        run: python scripts/check_public.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Prepare licensed vendor assets
        run: npm run build:vendor
      - name: Fictional-data browser checks
        run: npm run test:browser
        env:
          BROWSER_OUTPUT: ${{ runner.temp }}/workshift-browser
      - name: Responsive design checks
        run: npm run test:design
      - name: Save fictional screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fictional-browser-checks
          path: ${{ runner.temp }}/workshift-browser
          retention-days: 7
